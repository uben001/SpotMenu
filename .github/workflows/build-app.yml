name: Build SpotMenu app

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (unsigned / ad-hoc)
        run: |
          set -o pipefail
          xcodebuild \
            -project SpotMenu.xcodeproj \
            -scheme SpotMenu \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_HARDENED_RUNTIME=NO \
            build | tee build.log | grep -E "error:|warning: .*StatusItem|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check signature and launch test
        run: |
          APP=build/Build/Products/Release/SpotMenu.app
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "codesign verify reported a problem (see above)"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|TeamIdentifier|flags"
          "$APP/Contents/MacOS/SpotMenu" > launch.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "SpotMenu is still running after 8s: launch OK"
            kill $PID
          else
            echo "SpotMenu exited during launch:"
            cat launch.log
            exit 1
          fi

      - name: Zip app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent SpotMenu.app "$GITHUB_WORKSPACE/SpotMenu.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SpotMenu-app
          path: SpotMenu.app.zip

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
